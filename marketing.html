<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recup Station · Marketing Kit</title>
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="assets/recup.css">
<style>
  :root { --cy: #00e1ec; --ink: #e8f0f5; --mut: #7d8e99; --bg0: #05080b; --line: #1c2833;
          --disp: 'Barlow Condensed', 'Arial Narrow', sans-serif; --mn: 'IBM Plex Mono', Menlo, monospace; --sn: 'IBM Plex Sans', -apple-system, sans-serif; }
  body { font-family: var(--sn); padding: 24px 16px 60px; }
  .page { max-width: 1100px; margin: 0 auto; }
  .intro h1 { font: 800 40px var(--disp); text-transform: uppercase; margin: 0; letter-spacing: .02em; }
  .intro p { color: var(--mut); max-width: 70ch; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 22px; margin-top: 20px; }
  .item { display: grid; gap: 8px; align-content: start; }
  .item .meta { font: 600 11px var(--mn); letter-spacing: .1em; color: var(--mut); text-transform: uppercase; display: flex; justify-content: space-between; gap: 8px; }
  .item a.dl { color: var(--cy); text-decoration: none; }
  .item .cap { font-size: 13px; color: var(--mut); line-height: 1.5; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 10px; }
  .item .cap b { color: var(--ink); }
  .viewport { width: 100%; overflow: hidden; border: 1px solid var(--line); border-radius: 6px; position: relative; }
  .viewport > .frame { transform-origin: top left; position: absolute; top: 0; left: 0; }

  /* ---------- frames (native pixel sizes) ---------- */
  .frame { background: var(--bg0); color: var(--ink); overflow: hidden; position: relative; display: flex; flex-direction: column; padding: 90px 84px; box-sizing: border-box; }
  .frame.story { width: 1080px; height: 1920px; padding: 150px 90px 130px; }
  .frame.post { width: 1080px; height: 1350px; }
  .frame.a3 { width: 1190px; height: 1684px; padding: 110px 100px; }
  .frame .glow { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(circle at 90% 5%, rgba(0,225,236,.22), transparent 45%), radial-gradient(circle at 0% 100%, rgba(0,225,236,.08), transparent 40%); }
  .frame .grid-bg { position: absolute; inset: 0; pointer-events: none; opacity: .5; background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px); background-size: 90px 90px; mask-image: linear-gradient(180deg, rgba(0,0,0,.6), transparent 70%); -webkit-mask-image: linear-gradient(180deg, rgba(0,0,0,.6), transparent 70%); }
  .frame > * { position: relative; }
  .k { font: 600 26px var(--mn); letter-spacing: .22em; color: var(--cy); text-transform: uppercase; }
  .h { font: 800 150px/.86 var(--disp); text-transform: uppercase; letter-spacing: .005em; margin: 34px 0 0; }
  .h .c { color: var(--cy); }
  .sub { font: 400 38px/1.35 var(--sn); color: #b9c7cf; margin-top: 36px; max-width: 24ch; }
  .rule { height: 4px; background: var(--cy); width: 140px; margin: 44px 0; }
  .foot { margin-top: auto; display: flex; justify-content: space-between; align-items: flex-end; gap: 40px; }
  .brand { font: 800 44px var(--disp); letter-spacing: .12em; text-transform: uppercase; }
  .brand small { display: block; font: 600 20px var(--mn); letter-spacing: .2em; color: var(--mut); margin-top: 8px; }
  .qrbox { background: #fff; padding: 18px; border-radius: 10px; }
  .qrbox img { display: block; width: 240px; height: 240px; image-rendering: pixelated; }
  .qrlab { font: 600 20px var(--mn); letter-spacing: .14em; color: var(--cy); text-align: center; margin-top: 14px; }
  .callout { font: 800 64px/1 var(--disp); text-transform: uppercase; }
  .callout .c { color: var(--cy); }
  .squatbox { margin-top: 60px; border: 3px dashed #2a3a47; border-radius: 16px; height: 540px; display: grid; place-items: center; text-align: center; color: var(--mut); font: 600 26px var(--mn); letter-spacing: .14em; }
  .squatbox svg { width: 260px; height: 320px; display: block; margin: 0 auto 24px; }
  .count { font: 800 420px/.8 var(--disp); color: var(--cy); margin-top: 20px; letter-spacing: -.02em; }
  .menu-row { display: grid; grid-template-columns: 240px 1fr auto; gap: 30px; padding: 30px 0; border-top: 2px solid var(--line); align-items: baseline; }
  .menu-row .p { font: 600 22px var(--mn); letter-spacing: .14em; color: var(--cy); }
  .menu-row .n { font: 800 64px/1 var(--disp); text-transform: uppercase; }
  .menu-row .d { font: 400 26px var(--sn); color: var(--mut); margin-top: 8px; }
  .menu-row .pr { font: 800 60px var(--disp); color: var(--cy); }
  .menu-row.locked { opacity: .45; }
  .lock { font: 600 20px var(--mn); border: 2px solid var(--mut); padding: 6px 12px; border-radius: 6px; letter-spacing: .1em; color: var(--mut); }
  .ladder { display: grid; gap: 18px; margin-top: 30px; }
  .ladder div { display: grid; grid-template-columns: 90px 1fr; gap: 26px; align-items: center; font: 600 36px var(--sn); }
  .ladder i { font: 800 40px var(--disp); font-style: normal; width: 90px; height: 90px; border-radius: 50%; border: 4px solid var(--cy); color: var(--cy); display: grid; place-items: center; }
  .ladder small { display: block; font: 400 24px var(--sn); color: var(--mut); }
  body.render { padding: 0; background: #000; }
  body.render .intro, body.render .meta, body.render .cap { display: none; }
  body.render .grid { display: block; margin: 0; }
  body.render .viewport { border: none; border-radius: 0; overflow: visible; height: auto !important; }
  body.render .viewport > .frame { position: static; transform: none !important; margin-bottom: 40px; }
</style>
</head>
<body>
<div class="page">
  <div class="intro">
    <div class="eyebrow">08 · MARKETING VOICE · BODY SCIENCE SPECIALIST</div>
    <h1>Marketing kit</h1>
    <p>Ready-to-post Instagram images and a print poster, all in the Recup voice: authoritative, clinical, punchy, no fluff. Each QR opens The Diagnostic. Tap <b>Download PNG</b>, then post it, or print the A3 at a print shop.</p>
  </div>
  <div class="grid" id="grid"></div>
</div>

<template id="t-hook">
  <div class="frame story" data-name="01-story-hook">
    <div class="glow"></div><div class="grid-bg"></div>
    <div class="k">Phase 1 · The Invisible Energy Leak</div>
    <div class="h">If you can't<br>do this after<br>your run,<br><span class="c">your engine<br>is leaking.</span></div>
    <div class="squatbox"><div><svg viewBox="0 0 130 160" fill="none" stroke="#00e1ec" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><circle cx="70" cy="18" r="12" fill="#00e1ec" stroke="none"/><path d="M68 32 L58 78 L92 96 L86 142"/><path d="M58 78 L18 84"/><path d="M66 44 L100 52"/><path d="M66 44 L28 58"/></svg>PISTOL / PATTERSON SQUAT<br>VIDEO GOES HERE</div></div>
    <div class="sub" style="max-width:none;margin-bottom:40px">You aren't recovering. You're just decaying.</div>
    <div class="foot"><div class="brand">Recup Station<small>SCAN FOR THE DIAGNOSTIC</small></div><div><div class="qrbox" data-qr="diag"></div><div class="qrlab">60 SEC · FREE</div></div></div>
  </div>
</template>

<template id="t-identity">
  <div class="frame post" data-name="02-post-identity">
    <div class="glow"></div><div class="grid-bg"></div>
    <div class="k">Body Science Specialist</div>
    <div class="h" style="font-size:190px">Not a<br><span class="c">juice bar.</span></div>
    <div class="rule"></div>
    <div class="sub" style="max-width:26ch">We don't sell "health". We sell <b style="color:var(--ink)">Structural Integrity</b>: Metabolic Protocols for runners, poured at the finish line.</div>
    <div class="foot"><div class="brand">Scan. Identify the Leak.<br><span style="color:var(--cy)">Calibrate your Repair.</span><small>RECUP STATION · PHB SAUJANA</small></div><div><div class="qrbox" data-qr="diag"></div></div></div>
  </div>
</template>

<template id="t-scarcity">
  <div class="frame post" data-name="03-post-scarcity">
    <div class="glow"></div>
    <div class="k">PHB Saujana · Node 001</div>
    <div class="callout" style="margin-top:40px">Only</div>
    <div class="count">55</div>
    <div class="callout">Nodes for <span class="c">Saujana.</span></div>
    <div class="sub" style="max-width:28ch">Take the diagnostic now. Your Protocol is reserved at the booth + 10% off your first cup.</div>
    <div class="foot"><div class="brand">Scan to lock in<small id="dateLine">OPEN DAY · SATURDAY</small></div><div><div class="qrbox" data-qr="diag"></div></div></div>
  </div>
</template>

<template id="t-protocols">
  <div class="frame post" data-name="04-post-protocols">
    <div class="glow"></div>
    <div class="k">The Protocol · Menu</div>
    <div class="h" style="font-size:120px;margin-bottom:36px">Fuel the<br><span class="c">repair window.</span></div>
    <div class="menu-row locked"><div class="p">PRE-RUN</div><div><div class="n">Nitric Prime</div><div class="d">Opens the pipes · 15 min before flag-off</div></div><div class="lock">🔒 SOON</div></div>
    <div class="menu-row"><div class="p">DURING-RUN</div><div><div class="n">The Flow</div><div class="d">Electrolyte balance · sip every 2km</div></div><div class="pr" data-price="N01"></div></div>
    <div class="menu-row"><div class="p">POST-RUN</div><div><div class="n">The Build</div><div class="d">Protein + collagen · the metabolic window</div></div><div class="pr" data-price="N02"></div></div>
    <div class="foot"><div class="brand">Recup Station<small>NO LABELS. JUST THE PROTOCOL.</small></div><div><div class="qrbox" data-qr="diag" style="padding:12px"></div></div></div>
  </div>
</template>

<template id="t-ladder">
  <div class="frame post" data-name="05-post-ascension">
    <div class="glow"></div>
    <div class="k">The Ascension Model</div>
    <div class="h" style="font-size:118px">From thirsty to<br><span class="c">activated.</span></div>
    <div class="ladder" id="ladderList"></div>
    <div class="foot"><div class="brand">Every cup moves you up<small>ASK FOR YOUR MEMBER CODE</small></div></div>
  </div>
</template>

<template id="t-a3">
  <div class="frame a3" data-name="06-print-identity-A3">
    <div class="glow"></div><div class="grid-bg"></div>
    <div class="k" style="font-size:30px">Recup Station · Body Science Specialist</div>
    <div class="h" style="font-size:180px">Scan.<br>Identify<br>the leak.<br><span class="c">Calibrate<br>your repair.</span></div>
    <div class="sub" style="font-size:42px;max-width:30ch">Not a juice bar. Metabolic Protocols for runners. 10% off + your free Runner's Repair Manual.</div>
    <div class="foot"><div class="brand" style="font-size:52px">PHB Saujana<small>EVERY SATURDAY · FROM FLAG-OFF</small></div><div><div class="qrbox" data-qr="stand"></div><div class="qrlab">SCAN TO CHECK IN</div></div></div>
  </div>
</template>

<script src="assets/qrcode.js"></script>
<script src="assets/recup-core.js"></script>
<script>
  const C = RECUP_CONFIG;
  const RENDER = new URLSearchParams(location.search).has('render');
  if (RENDER) document.body.classList.add('render');
  const LINKS = { diag: RECUP.siteUrl('intake-ig.html') + '?utm_content=poster', stand: RECUP.siteUrl('intake-ipad.html?src=qr') };
  const ITEMS = [
    ['t-hook', 'IG Story · 1080×1920', '<b>Caption:</b> If you can\'t do this after your run, your metabolic engine is leaking. You aren\'t recovering; you\'re just decaying. Scan for the diagnostic. 🔗 in bio<br><b>Tip:</b> put your squat video in the dashed box in the IG editor.'],
    ['t-identity', 'IG Post · 1080×1350', '<b>Caption:</b> Not a juice bar. We sell Structural Integrity. Scan. Identify the Leak. Calibrate your Repair. #RecupStation #PHBSaujana'],
    ['t-scarcity', 'IG Post · 1080×1350', '<b>Caption:</b> Scarcity. Only 55 nodes available for Saujana. Scan to lock in. Tag the run club.'],
    ['t-protocols', 'IG Post · 1080×1350', '<b>Caption:</b> During-run: The Flow. Post-run: The Build. Pre-run Nitric Prime is coming, unlocked for members on their 2nd cup.'],
    ['t-ladder', 'IG Post · 1080×1350', '<b>Caption:</b> Every cup moves you up. 10% → Nitric Boost → Buddy free → 20% + Activation → 25% + Member kit.'],
    ['t-a3', 'Print · A3 poster', '<b>Use:</b> Poster B, the identity poster for the booth table. QR opens the self check-in.'],
  ];
  const grid = document.getElementById('grid');
  ITEMS.forEach(([tid, label, cap]) => {
    const frag = document.getElementById(tid).content.cloneNode(true);
    const frame = frag.querySelector('.frame'); const name = frame.dataset.name;
    const item = document.createElement('div'); item.className = 'item';
    item.innerHTML = `<div class="meta"><span>${label}</span><a class="dl" href="marketing/${name}.png" download>Download PNG ↓</a></div><div class="viewport"></div><div class="cap">${cap}</div>`;
    item.querySelector('.viewport').appendChild(frame); grid.appendChild(item);
  });
  document.querySelectorAll('[data-qr]').forEach(el => { const q = qrcode(0, 'M'); q.addData(LINKS[el.dataset.qr]); q.make(); el.innerHTML = q.createImgTag(8, 0); });
  document.querySelectorAll('[data-price]').forEach(el => { const p = C.PROTOCOLS[el.dataset.price]; el.textContent = p.price ? 'RM' + p.price : ''; });
  document.getElementById('ladderList').innerHTML = C.LADDER.map(r => `<div><i>${r.cup === C.LADDER.length ? '★' : r.cup}</i><span>${r.reward}<small>${r.name}</small></span></div>`).join('');
  try { const d = new Date(C.LAUNCH_DATE); document.getElementById('dateLine').textContent = 'OPEN DAY · ' + d.toLocaleDateString('en-MY', { weekday: 'long', day: 'numeric', month: 'short' }).toUpperCase(); } catch {}
  function fit() { if (RENDER) return; document.querySelectorAll('.viewport').forEach(v => { const f = v.firstElementChild; const s = v.clientWidth / f.offsetWidth; f.style.transform = `scale(${s})`; v.style.height = f.offsetHeight * s + 'px'; }); }
  addEventListener('resize', fit); document.fonts.ready.then(fit); fit();
</script>
</body>
</html>
